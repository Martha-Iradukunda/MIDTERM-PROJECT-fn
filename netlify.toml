# Rwamagana Mall on Netlify: the shop (this repo) + the API from MIDTERM-PROJECT-bn as a Netlify Function.
[build]
  command = "npm run build && sh netlify-build.sh"
  publish = "dist"
  functions = "server/netlify"

[build.environment]
  NODE_VERSION = "22"
  SERVER_REPO = "https://github.com/Martha-Iradukunda/MIDTERM-PROJECT-bn.git"
  SERVER_BRANCH = "all-setup-features"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "pg-native", "swagger-ui-express", "swagger-ui-dist", "bufferutil", "utf-8-validate"]
  included_files = ["server/migrations/**", "server/seed/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/api/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-docs/*"
  to = "/.netlify/functions/api/api-docs/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

# The shop is a single-page app: every other address opens index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
